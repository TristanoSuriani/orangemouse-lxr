<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orange Mouse</title>
  <meta name="description" content="A browser studio: the LXR drum machine and Orange Mouse VA">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Orange <b>Mouse</b></div>
    <nav class="rack" id="rack" aria-label="Devices: Alt+1 to Alt+9, or Alt+arrows"></nav>
    <div class="dock">
      <label class="dock-item">Vol <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8"></label>
      <label class="dock-item">MIDI in <select id="midiIn"><option value="">None</option></select></label>
      <label class="dock-item">out <select id="midiOut"><option value="">None</option></select></label>
      <details class="sd-menu">
        <summary class="dock-button">SD card</summary>
        <div class="sd-items">
          <button class="dock-button" id="exportCard" type="button">Export</button>
          <label class="dock-button">Import <input type="file" id="importCard" accept=".img,.bin" hidden></label>
          <button class="dock-button" id="resetCard" type="button">Erase</button>
        </div>
      </details>
    </div>
    <canvas class="lcd help-strip" id="help" aria-label="Help"></canvas>
  </header>

  <div class="stage" id="devices">
  <main class="machine device" id="machine" aria-label="LXR drum machine">
    <header class="device-head"><h2><b>LXR</b></h2><span class="caption">drum machine · 7 voices</span><span class="spacer"></span></header>
    <section class="top">
      <div class="display-block">
        <canvas id="lcd" class="lcd" width="400" height="92" aria-label="Display"></canvas>
        <div class="pots" id="pots"></div>
      </div>
      <div class="encoder-block">
        <div class="encoder" id="encoder" role="spinbutton" tabindex="0" aria-label="Data encoder (drag or scroll to turn, click to push)" aria-valuetext="turn to move the cursor or change the value">
          <div class="encoder-cap"><div class="encoder-mark"></div></div>
        </div>
        <span class="caption">Data</span>
      </div>
      <div class="faders" id="faders"></div>
    </section>

    <section class="row voices" id="voices"></section>

    <section class="row controls">
      <div class="group" id="pages"></div>
      <div class="group" id="selects"></div>
      <div class="group" id="modes"></div>
      <div class="group" id="transport"></div>
    </section>

    <section class="row steps" id="steps"></section>
  </main>
  </div>

  <div class="power" id="power">
    <button type="button" id="powerButton">Switch on</button>
    <p id="powerMessage">Audio starts when you switch on.</p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
